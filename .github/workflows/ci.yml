name: CI

# Only where the whole repository is present. A feature branch holds one slice of it, so
# `make proto` there has no proto/ to generate from.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint and generate
        run: make proto

      - name: Golden files match the contract
        run: |
          make golden
          git diff --exit-code -- tests/contract/golden \
            || { echo "::error::golden files are stale — run 'make golden' and commit"; exit 1; }

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate gRPC code
        run: make proto

      - name: Lint (ruff, mypy, buf) — warnings are errors
        run: make lint

      - name: Unit and contract tests
        run: make test

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate gRPC code
        run: make proto

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (warnings are errors via Directory.Build.props)
        run: dotnet build --nologo

      - name: Unit tests and the C# half of the contract test
        run: |
          dotnet test --nologo --no-build \
            --filter "Category!=Integration&Category!=Smoke&Category!=SmokeLlm"

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate gRPC code
        run: make proto

      - name: Restore the Ollama model
        uses: actions/cache@v4
        with:
          path: .ollama-cache
          key: ollama-${{ hashFiles('.env.example') }}

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for every service to report healthy
        run: ./scripts/wait-healthy.sh 600

      - name: Load the fixed dataset
        run: ./scripts/seed.sh

      - name: Smoke the scoring and streaming paths
        run: ./scripts/smoke.sh

      - name: Place bids end to end
        run: ./scripts/integration.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Make the model cache readable by the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ollama-cache || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v
